  run_command: |
    mkdir -p storage/keys
    if [ -n "$MIKROTIK_CORE_SSH_KEY_B64" ]; then
      printf '%s' "$MIKROTIK_CORE_SSH_KEY_B64" | base64 -d > storage/keys/mikrotik_core_id_ed25519
      chmod 600 storage/keys/mikrotik_core_id_ed25519
    fi
    php artisan queue:work --tries=1 --timeout=120 --sleep=3 --max-time=3600
  build_command: |
    composer install --no-dev --optimize-autoloader
  source_dir: /

# ── Planificador de tareas ──────────────────────────────────────────────────
# CRÍTICO. Sin este componente NO ocurre nada del ciclo automático: no se
# generan facturas, no se envían recordatorios, no se corta a los morosos, no se
# reconcilian los cortes y no se recolecta tráfico. Hasta 2026-07-30 no existía
# en esta especificación, y es la causa del incidente que motivó crear el
# comando `billing:verify-monthly` (el failover sólo ve fallos por cliente, no
# un job que nunca llegó a ejecutarse).
#
# `schedule:work` es un proceso de larga vida que dispara `schedule:run` cada
# minuto — el equivalente a un cron, apropiado para un worker de App Platform.
#
# Verificación tras el despliegue:
#   php artisan billing:verify-monthly   → debe reportar 'ok', nunca 'no_show'
#   php artisan billing:verify-cuts
- environment_slug: php
  envs:
  - key: APP_NAME
    scope: RUN_AND_BUILD_TIME
    value: ISPWatch
  - key: APP_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: APP_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:APP_KEY>>>
  - key: APP_DEBUG
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: APP_URL
    scope: RUN_AND_BUILD_TIME
    value: https://ispwatch-crm.app
  - key: LOG_CHANNEL
    scope: RUN_AND_BUILD_TIME
    value: stack
  - key: LOG_STACK
    scope: RUN_AND_BUILD_TIME
    value: single
  # info (no warning): el planificador registra en INFO el resultado de cada
  # ciclo de facturación y corte; con `warning` esa traza se pierde.
  - key: LOG_LEVEL
    scope: RUN_AND_BUILD_TIME
    value: info
  - key: DB_CONNECTION
    scope: RUN_AND_BUILD_TIME
    value: pgsql
  - key: DB_HOST
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:DB_HOST>>>
  - key: DB_PORT
    scope: RUN_AND_BUILD_TIME
    value: "5432"
  - key: DB_DATABASE
    scope: RUN_AND_BUILD_TIME
    value: postgres
  - key: DB_USERNAME
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:DB_USERNAME>>>
  - key: DB_PASSWORD
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:DB_PASSWORD>>>
  - key: DB_SCHEMA
    scope: RUN_AND_BUILD_TIME
    value: public
  - key: CACHE_STORE
    scope: RUN_AND_BUILD_TIME
    value: database
  - key: QUEUE_CONNECTION
    scope: RUN_AND_BUILD_TIME
    value: database
  # El planificador envía correo (factura creada, recordatorios, alertas de
  # no-show), así que necesita la configuración SMTP completa.
  - key: MAIL_MAILER
    scope: RUN_AND_BUILD_TIME
    value: smtp
  - key: MAIL_HOST
    scope: RUN_AND_BUILD_TIME
    value: smtp-relay.brevo.com
  - key: MAIL_PORT
    scope: RUN_AND_BUILD_TIME
    value: "587"
  - key: MAIL_USERNAME
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:MAIL_USERNAME>>>
  - key: MAIL_PASSWORD
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:MAIL_PASSWORD>>>
  - key: MAIL_ENCRYPTION
    scope: RUN_AND_BUILD_TIME
    value: tls
  - key: MAIL_FROM_ADDRESS
    scope: RUN_AND_BUILD_TIME
    value: ispwatchcol@gmail.com
  - key: MAIL_FROM_NAME
    scope: RUN_AND_BUILD_TIME
    value: ISPWatch
  # El corte y la recolección de tráfico hablan con el CORE por SSH.
  - key: PORTAL_IP
    scope: RUN_AND_BUILD_TIME
    value: 192.168.88.252
  - key: MIKROTIK_CORE_VPN_IP
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:MIKROTIK_CORE_VPN_IP>>>
  - key: MIKROTIK_CORE_API_HOST
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:MIKROTIK_CORE_API_HOST>>>
  - key: MIKROTIK_CORE_API_PORT
    scope: RUN_AND_BUILD_TIME
    value: "8728"
  - key: MIKROTIK_CORE_API_USER
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:MIKROTIK_CORE_API_USER>>>
  - key: MIKROTIK_CORE_API_PASS
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:MIKROTIK_CORE_API_PASS>>>
  - key: MIKROTIK_CORE_SSH_HOST
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:MIKROTIK_CORE_SSH_HOST>>>
  - key: MIKROTIK_CORE_SSH_PORT
    scope: RUN_AND_BUILD_TIME
    value: "2222"
  - key: MIKROTIK_CORE_SSH_USER
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:MIKROTIK_CORE_SSH_USER>>>
  - key: MIKROTIK_CORE_SSH_KEY_PASSPHRASE
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:MIKROTIK_CORE_SSH_KEY_PASSPHRASE>>>
  - key: MIKROTIK_CORE_SSH_PASS
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:MIKROTIK_CORE_SSH_PASS>>>
  - key: MIKROTIK_CORE_SSH_KEY_B64
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:MIKROTIK_CORE_SSH_KEY_B64>>>
  github:
    branch: main
    deploy_on_push: true
    repo: ispwatchcol/ISPWatch
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  name: scheduler
  run_command: |
    mkdir -p storage/keys
    if [ -n "$MIKROTIK_CORE_SSH_KEY_B64" ]; then
      printf '%s' "$MIKROTIK_CORE_SSH_KEY_B64" | base64 -d > storage/keys/mikrotik_core_id_ed25519
      chmod 600 storage/keys/mikrotik_core_id_ed25519
    fi
    php artisan schedule:work
  build_command: |
    composer install --no-dev --optimize-autoloader
  source_dir: /
