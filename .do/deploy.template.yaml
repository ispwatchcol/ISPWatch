  - key: APP_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: APP_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: <<<CAMBIAR:APP_KEY>>>
  - key: APP_DEBUG
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: APP_URL
    scope: RUN_AND_BUILD_TIME
    value: https://ispwatch-crm.app
  - key: LOG_CHANNEL
    scope: RUN_AND_BUILD_TIME
    value: stack
  - key: LOG_STACK
    scope: RUN_AND_BUILD_TIME
    value: single
  - key: LOG_LEVEL
    scope: RUN_AND_BUILD_TIME
    value: warning
  - key: DB_CONNECTION
    scope: RUN_AND_BUILD_TIME
